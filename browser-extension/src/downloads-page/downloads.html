<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>下载管理 - CineInsight 媒体抓取</title>
    <link rel="stylesheet" href="../common/ui.css" />
    <style>
      body { max-width: 860px; margin: 0 auto; }
      .task-name { font-weight: 600; }
      .state { flex: none; }
      .state-done { color: var(--ok); }
      .state-failed { color: var(--danger); }
      .state-paused, .state-queued { color: var(--warn); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>下载管理</h1>
      <div class="row">
        <span id="summary" class="muted small"></span>
        <button id="clear-finished">清掉已完成</button>
      </div>
    </div>
    <div id="message" class="notice small" hidden></div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty" hidden>还没有下载任务。</div>
    <script type="module" src="downloads.js"></script>
  </body>
</html>
