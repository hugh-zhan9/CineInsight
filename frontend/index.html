<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>析微影策</title>
    <!-- 页面一出来就按系统深浅定主题（App 读到设置后再按设置套用）：启动失败页，以及首页上没有注入启动状态时
         App 读到启动状态之前只画底色，这几帧要和系统一致，深色系统下不先闪一下浅色。 -->
    <script>document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
</head>
<body>
<!-- 正常启动（Go 送出首页时在 <html> 上写 data-startup="ready"，见 startupStateMiddleware）默认进观看首页：第一帧就打开
     影院表面，不等 App 读回 GetStartupError。启动失败（error）与没有注入时（直接由 vite 送出）不开，跟随系统深浅。 -->
<script>if (document.documentElement.getAttribute('data-startup') === 'ready') document.body.classList.add('surface-cinema');</script>
<div id="app"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
