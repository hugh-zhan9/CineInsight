<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPhone：从主屏幕图标打开时去掉 Safari 地址栏，这是它唯一的整页全屏方式（安卓 Chrome 有元素全屏 API，
       独立窗口另需 manifest，这里不做）。mobile-web-app-capable 只为让 Chrome 不再对 apple- 前缀告警。 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="析微影策" />
  <!-- 地址栏 / 状态栏颜色跟页面底色（影院表面 --cinema-bg）一致。 -->
  <meta name="theme-color" content="#0d1213" />
  <title>析微影策</title>
</head>
<!-- 手机网页始终是影院深色表面（D-MW-06）：通用颜色变量在整个 body 里映射到影院变量，teleport 到 body 的面板与提示也跟着走。 -->
<body class="surface-cinema">
  <div id="short-feed-app"></div>
  <script type="module" src="/src/short-feed/main.js"></script>
</body>
</html>
